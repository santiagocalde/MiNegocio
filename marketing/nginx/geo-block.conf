# Strategy:
# 1. Traffic via Cloudflare (CF-Connecting-IP header present) -> ALLOWED (CF handles geo-filtering)
# 2. Direct traffic -> check source IP against allowed ranges
# 3. Known cloud/VPS providers used for attacks -> BLOCKED

# Map: determine the real client IP
map $http_cf_connecting_ip $real_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

# Geo-blocking on direct connections only (non-Cloudflare)
# If CF-Connecting-IP is present, it means traffic came through CF = allowed
geo $remote_addr $geo_block_direct {
    default 1;
    
    # Argentina
    181.0.0.0/8 0;
    186.0.0.0/8 0;
    190.0.0.0/8 0;
    200.0.0.0/8 0;
    201.0.0.0/8 0;
    
    # Cloudflare IPs
    173.245.48.0/20 0;
    103.21.244.0/22 0;
    103.22.200.0/22 0;
    103.31.4.0/22 0;
    141.101.64.0/18 0;
    108.162.192.0/18 0;
    190.93.240.0/20 0;
    188.114.96.0/20 0;
    197.234.240.0/22 0;
    198.41.128.0/17 0;
    162.158.0.0/15 0;
    104.16.0.0/13 0;
    104.24.0.0/14 0;
    172.64.0.0/13 0;
    131.0.72.0/22 0;
    
    # Private / VPN / local
    127.0.0.0/8 0;
    10.0.0.0/8 0;
    172.16.0.0/12 0;
    192.168.0.0/16 0;
    100.64.0.0/10 0;
}

# Final geo decision: block only if no CF header AND non-allowed country
map $http_cf_connecting_ip $should_geo_block {
    "" $geo_block_direct;   # No CF = check geo
    default 0;              # Has CF header = allowed (CF handles it)
}

# ASN blocking for known malicious cloud providers
